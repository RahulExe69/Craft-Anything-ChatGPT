[package]
name = "craft-anything-android-bridge"
description = "JNI bridge from the native Craft Anything Rust engine to the Android app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# JNI symbol exports require an unsafe symbol-name attribute. Keep this crate denied by default
# and isolate that unavoidable ABI boundary in one explicitly allowed module.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[lib]
name = "craft_anything_android"
crate-type = ["cdylib"]

[dependencies]
craft-anything-engine = { workspace = true }
craft-anything-evidence = { workspace = true }
serde_json = { workspace = true }
jni = "0.22"
log = { workspace = true }
