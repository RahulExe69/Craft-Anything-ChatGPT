name: Android APK

on:
  push:
    branches:
      - feature/android-native-app
  pull_request:
    paths:
      - "apps/craft-anything-android/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache cargo-ndk
        id: cargo-ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-v1

      - name: Install cargo-ndk
        if: steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: craft-anything-android-bridge

      - name: Test the Rust bridge on the host
        run: cargo test -p craft-anything-android-bridge --lib

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Test Android JVM unit tests
        working-directory: apps/craft-anything-android
        run: gradle --build-cache --parallel :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: apps/craft-anything-android
        run: gradle --build-cache --parallel :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: craft-anything-android-debug
          path: apps/craft-anything-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build optimized release APKs
        working-directory: apps/craft-anything-android
        run: gradle --build-cache --parallel :app:assembleRelease

      - name: Upload optimized release APKs
        uses: actions/upload-artifact@v4
        with:
          name: craft-anything-android-release-preview
          path: apps/craft-anything-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Compose UI tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: apps/craft-anything-android
          script: gradle --build-cache --parallel :app:connectedDebugAndroidTest

